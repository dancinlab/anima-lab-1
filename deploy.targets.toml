[targets.aiden]
ssh_alias = "aiden"
role = "gpu-research"

[targets.summer]
ssh_alias = "summer"
proxy_jump = "aiden"
role = "gpu-research-runtime"
remote_root = "/home/summer/services/anima-lab-1"
service = "anima-lab-1"
python = "python3"
requirements = "requirements-runtime.txt"
port = 8765
runtime_args = [
  "--web",
  "--max-cells", "32",
  "--no-camera",
  "--no-vision",
  "--no-telepathy",
  "--no-cloud",
  "--no-conscious-lm",
]

[public_routes.anima]
target = "summer"
hostname = "anima.basedonapps.com"
zone = "basedonapps.com"
tunnel_name = "anima-lab-1"
service = "anima-lab-1-tunnel"
cloudflared_url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
ttl = 1
